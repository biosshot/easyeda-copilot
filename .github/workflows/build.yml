name: Build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    uses: ./.github/workflows/integration.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: mcp-release
          path: artifacts
      - name: Publish tested MCP archive
        run: node scripts/publish-release.mjs artifacts

      - name: Install MCP Registry publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to Official MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mcp
        run: |
          for attempt in 1 2 3 4; do
            if ../mcp-publisher login github-oidc; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "MCP Registry OIDC login failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          ../mcp-publisher publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

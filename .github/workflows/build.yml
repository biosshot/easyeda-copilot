name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build EasyEDA extension
        run: npm run build

      - name: Check and build MCP
        # Backend stays local in this branch; this workflow does not publish it.
        run: |
          rustup default stable
          npm run native:build --workspace=eda-copilot-backend
          npm run build --workspace=eda-copilot-backend
          npm run check --workspace=mcp

      - name: Check installed MCP backend dependency before a release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mcp
        run: |
          backend_spec=$(node -p "const p = require('./package.json'); 'eda-copilot-backend@' + p.dependencies['eda-copilot-backend']")
          npm view "$backend_spec" version

      - name: Pack MCP
        run: |
          mkdir artifacts
          npm pack --workspace=mcp --pack-destination artifacts
          cp build/dist/*.eext artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: easyeda-copilot-${{ github.sha }}
          path: artifacts/*
          retention-days: 14

      - name: Publish MCP package to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_spec=$(node -p "const p = require('./mcp/package.json'); p.name + '@' + p.version")
          npm view "$package_spec" version || npm publish --workspace=mcp --access public

      - name: Install MCP Registry publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to Official MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mcp
        run: |
          for attempt in 1 2 3 4; do
            if ../mcp-publisher login github-oidc; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "MCP Registry OIDC login failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          ../mcp-publisher publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

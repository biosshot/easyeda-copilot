name: Backend portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Set up Rust
        run: rustup default stable
      - name: Build native solver
        run: npm run native:build --workspace=eda-copilot-backend
      - name: Check backend
        run: npm run check --workspace=eda-copilot-backend
      - name: Check MCP
        run: npm run check --workspace=mcp
      - name: Test installed packages
        run: npm run test:package --workspace=eda-copilot-backend
      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-node-${{ matrix.node }}
          path: backend/.artifacts/*.tgz
          retention-days: 7
